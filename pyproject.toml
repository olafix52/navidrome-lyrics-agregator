[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "navidrome-lyrics-aggregator"
version = "1.0.0"
description = "Asynchronous sidecar daemon for Navidrome downloading word-by-word TTML, YAML and LRC lyrics from multiple providers"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "olafix52"}
]
keywords = [
    "navidrome",
    "lyrics",
    "subsonic",
    "ttml",
    "lrc",
    "music",
    "audio",
    "sidecar",
    "word-sync"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia :: Sound/Audio",
]
dependencies = [
    "mutagen>=1.47.0",
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
    "pyyaml>=6.0.1",
    "watchdog>=4.0.0",
    "rich>=13.7.1",
    "beautifulsoup4>=4.12.3",
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1.0",
    "pytest-asyncio>=0.23.6",
]

[project.urls]
Homepage = "https://github.com/olafix52/navidrome-lyrics-agregator"
Repository = "https://github.com/olafix52/navidrome-lyrics-agregator"
Issues = "https://github.com/olafix52/navidrome-lyrics-agregator/issues"

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-v"
testpaths = ["tests"]
asyncio_mode = "strict"

[tool.ruff]
line-length = 120
target-version = "py311"
