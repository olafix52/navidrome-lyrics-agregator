name: "🐛 Bug Report"
description: "Create a report to help us improve Navidrome Lyrics Aggregator"
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug! Please fill out the sections below.

  - type: textarea
    id: description
    attributes:
      label: "Describe the bug"
      description: "A clear and concise description of what the bug is."
    validations:
      required: true

  - type: input
    id: track-info
    attributes:
      label: "Track Details (if applicable)"
      description: "Artist, Title, Audio format (FLAC, MP3, etc.), and duration."
      placeholder: "e.g. Queen - Bohemian Rhapsody (FLAC, 354s)"

  - type: dropdown
    id: environment
    attributes:
      label: "Environment"
      description: "How are you running the application?"
      options:
        - "Docker Compose"
        - "Docker standalone"
        - "Directly on Host (Python venv)"
        - "Other"
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: "Logs & Console Output"
      description: "Please paste relevant logs with NLA_LOG_LEVEL=DEBUG if possible."
      render: shell

  - type: textarea
    id: additional-context
    attributes:
      label: "Additional Context"
      description: "Any other details about your setup or config."
