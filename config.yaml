# ==============================================================================
# Navidrome Lyrics Aggregator - Configuration File
# ==============================================================================

# Directory where your music files reside (mounted volume in Docker)
music_dir: "/music"

# Periodic scan interval in daemon mode (e.g. "1h", "30m", "3600s", "1d")
scan_interval: "1h"

# Debounce time in seconds for real-time filesystem watcher events
watch_debounce_seconds: 3.0

# Allowed time deviation (in seconds) between audio duration and lyrics duration
duration_tolerance_seconds: 2.5

# Minimum similarity score (0.0 to 1.0) required to accept lyrics
min_similarity_score: 0.75

# Lyrics storage destination: 'sidecar' (companion files), 'embedded' (audio tags), or 'both'
storage_mode: "sidecar"

# Embed word/syllable-level timing (Enhanced LRC <mm:ss.xx>) into audio tags for karaoke players (Feishin, Symfonium)
embed_word_sync: true

# Force re-scanning and overwriting existing lyrics files (.ttml, .yaml, .lrc)
overwrite: false

# Upgrade lower quality lyrics (.lrc/.txt) to higher quality formats (.ttml/.yaml) if found
upgrade_quality: true

# Dry run mode: search and log without saving any files to disk
dry_run: false

# Allow falling back to unsynced plain text lyrics if no synchronized lyrics are found
allow_plain_lyrics: false

# Concurrency and network settings
concurrency: 4
network_timeout: 10.0
max_retries: 3

# HTTP User-Agent header
user_agent: "NavidromeLyricsAggregator/1.0 (https://github.com/navidrome-lyrics-aggregator)"

# Logging verbosity: DEBUG, INFO, WARNING, ERROR
log_level: "INFO"
# Optional log file destination
# log_file: "/config/aggregator.log"

# ==============================================================================
# Lyrics Providers Priority Cascade
# The aggregator checks providers in the exact order listed below.
# As soon as valid synchronized lyrics are matched, the cascade stops.
# ==============================================================================
enabled_providers:
  - "spicylyrics"    # Spicy Lyrics Developer API (TTML syllable word-sync / LRC line-sync)
  - "amll"           # Apple Music-Like Lyrics DB (TTML syllable-level sync)
  - "apple_music"    # Apple Music Catalog API / AMLL bridge (TTML)
  - "rmmrevival"     # RMM Revival / Apple Music Worker (word-sync TTML & LRC)
  - "unison"         # Unison / Better Lyrics crowdsourced synced lyrics (TTML/YAML/LRC)
  - "binilyrics"     # BiniLyrics / Aligned REST API (TTML/LRC)
  - "lrclib"         # LRCLIB Database (YAML word-synced and LRC line-synced)
  - "musixmatch"     # Musixmatch iOS Mobile API (RichSync TTML word-sync & synced LRC)
  - "neblend"        # Apple Music + NetEase word timing (mild-lyrics neblend)
  - "triblend"       # Apple Music + NetEase timing + QQ Music filler (mild-lyrics triblend)
  - "kutriblend"     # Apple Music + NetEase timing + Kugou filler (mild-lyrics kutriblend)
  - "netease"        # NetEase Cloud Music 163 API (YRC word-sync & LRC)
  - "blend"          # Apple Music + QQ Music word timing (mild-lyrics blend)
  - "qqmusic"        # QQ Music / Tencent API (QRC word-sync & LRC)
  - "kublend"        # Apple Music + Kugou word timing (mild-lyrics kublend)
  - "kugou"          # Kugou Music API (KRC word-sync & LRC)
  - "kuwo"           # Kuwo Music API (synced LRC)
  - "lyricsify"      # Lyricsify community LRC database
  - "genius"         # Genius database (plain lyrics fallback)

# ==============================================================================
# Provider-Specific Configurations & API Settings
# ==============================================================================
providers:
  amll:
    enabled: true
    rate_limit_per_second: 5.0
    timeout_seconds: 10.0
    # custom_url: "https://api.amll.dev"

  apple_music:
    enabled: true
    rate_limit_per_second: 2.0
    timeout_seconds: 10.0
    # Optional Apple Music API credentials (if omitted, AMLL bridge is used):
    # api_key: "Bearer YOUR_DEVELOPER_TOKEN"
    # extra:
    #   storefront: "us"
    #   media_user_token: "YOUR_MEDIA_USER_TOKEN"

  rmmrevival:
    enabled: true
    rate_limit_per_second: 2.0
    timeout_seconds: 15.0
    # custom_url: "https://lyrics.rmmreviv.al"

  unison:
    enabled: true
    rate_limit_per_second: 3.0
    timeout_seconds: 10.0
    # custom_url: "https://unison.boidu.dev" # Public open crowdsourced database (no API key required)

  spicylyrics:
    enabled: true
    rate_limit_per_second: 3.0
    timeout_seconds: 10.0
    # api_key: "sl_sk_..." # SPICY_LYRICS_SECRET_KEY from https://developers.spicylyrics.org/dashboard
    # extra:
    #   spotify_client_id: ""       # Optional: Spotify API credentials for automatic track ID resolution
    #   spotify_client_secret: ""

  binilyrics:
    enabled: true
    rate_limit_per_second: 3.0
    timeout_seconds: 10.0
    # custom_url: "https://lyrics-api.binimum.org"

  lrclib:
    enabled: true
    rate_limit_per_second: 4.0
    timeout_seconds: 10.0
    # custom_url: "https://lrclib.net"

  musixmatch:
    enabled: true
    rate_limit_per_second: 2.0
    timeout_seconds: 10.0
    extra:
      token_path: "data/musixmatch_token.json"
    # Musixmatch user token (set in config.local.yaml or MUSIXMATCH_USER_TOKEN env var)
    # api_key: "YOUR_MUSIXMATCH_USER_TOKEN"

  qqmusic:
    enabled: true
    rate_limit_per_second: 3.0
    timeout_seconds: 10.0

  kuwo:
    enabled: true
    rate_limit_per_second: 3.0
    timeout_seconds: 10.0

  netease:
    enabled: true
    rate_limit_per_second: 3.0
    timeout_seconds: 10.0

  kugou:
    enabled: true
    rate_limit_per_second: 3.0
    timeout_seconds: 10.0

  lyricsify:
    enabled: true
    rate_limit_per_second: 1.0
    timeout_seconds: 30.0
    extra:
      flaresolverr_url: "http://localhost:8191/v1"
    # custom_url: "https://www.lyricsify.com"

  genius:
    enabled: true
    rate_limit_per_second: 1.5
    timeout_seconds: 10.0
    # api_key: "YOUR_GENIUS_API_CLIENT_ACCESS_TOKEN"

# ==============================================================================
# Navidrome Subsonic Integration & Scan Trigger
# ==============================================================================
navidrome:
  url: "http://localhost:4533"
  # user: "your_navidrome_user"
  # password: "your_navidrome_password"
  auto_scan: false
